[package]
name = "cedrodb"
version = "0.9.0"
edition = "2021"
rust-version = "1.74"
description = "Experimental embedded JSON storage with agent checkpoints and hybrid memory retrieval"
license = "MIT"
repository = "https://github.com/uppy19d0/cedrodb"
homepage = "https://www.ltavarez.me/labs/cedrodb"

[dependencies]
crc32fast = "1.4"
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
